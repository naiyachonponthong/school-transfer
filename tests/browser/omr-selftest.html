<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><title>omr selftest</title></head><body>
<!-- ทดสอบตัวอ่านกระดาษด้วยมือ: คัดลอกไปไว้ใน public/ ชั่วคราวแล้วเปิดในเบราว์เซอร์ ผลอยู่ใน window.__result (ทุกแถวต้อง match: true) -->
<canvas id="c"></canvas><pre id="out">running…</pre>
<script src="/assets/scangrade/sheet-layout.js"></script>
<script src="/assets/scangrade/omr.js"></script>
<script src="/assets/scangrade/sheet.js"></script>
<script>
// ทดสอบชั่วคราว: วาดกระดาษจาก sheet.js → ระบายคำตอบ → หมุน/เอียง + noise → อ่านกลับด้วย omr.js
async function one(n, rot, answers, code) {
  let svg = SGSheet.svg({ n, groups: ['ก','ข'], student: { name: 'ทดสอบ', code, seat_no: 7, seat_group: 'ก' } });
  const L = SheetLayout.layout(n, ['ก','ข']);
  const fills = L.answer.items.map((it, i) => { const a = answers[i]; if (a === '0') return ''; const cs = a === '9' ? [0, 2] : [Number(a) - 1];
    return cs.map(c => `<circle cx="${it.xs[c]}" cy="${it.y}" r="${L.answer.r * 0.95}" fill="#333"/>`).join(''); }).join('');
  svg = svg.replace('</svg>', fills + '</svg>');
  const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  await img.decode();
  const W = 1500, H = 2000, cv = document.getElementById('c'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d', { willReadFrequently: true });
  x.fillStyle = '#8a8070'; x.fillRect(0, 0, W, H);                // โต๊ะ
  x.save(); x.translate(W / 2, H / 2); x.rotate(rot * Math.PI / 180); x.transform(1, 0.03, -0.02, 1, 0, 0);
  const pw = Math.abs(rot) % 180 === 90 ? 1000 : 1150, ph = pw * 297 / 210; x.drawImage(img, -pw / 2, -ph / 2, pw, ph); x.restore();
  const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.25)'); x.fillStyle = g; x.fillRect(0, 0, W, H); // แสงไม่เท่ากัน
  const d = x.getImageData(0, 0, W, H); for (let i = 0; i < d.data.length; i += 4) { const nz = (Math.random() - .5) * 30; d.data[i] += nz; d.data[i+1] += nz; d.data[i+2] += nz; }
  const r = OMR.scan(OMR.fromImageData(d), { n, groups: ['ก','ข'] });
  return { n, rot, ok: r.ok, code: r.code, seat: r.seat, match: r.answers === answers, diff: r.ok ? [...answers].map((a,i)=>a!==r.answers[i]?i+1:0).filter(Boolean) : r.message, review: r.review };
}
(async () => {
  const res = [];
  for (const [n, rot] of [[30, 3], [40, 180], [60, -8], [100, 90], [17, 0]]) {
    let a = ''; for (let i = 0; i < n; i++) a += i === 4 ? '0' : i === 9 ? '9' : String(1 + (i * 7 + n) % 4);
    res.push(await one(n, rot, a, '69001'));
  }
  document.getElementById('out').textContent = JSON.stringify(res, null, 1);
  window.__result = res;
})();
</script></body></html>
